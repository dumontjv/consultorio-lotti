<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="indigoLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="softShadow2">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo externo -->
  <circle cx="200" cy="200" r="180" fill="url(#indigoGrad)" filter="url(#softShadow2)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
  
  <!-- Círculo interno branco -->
  <circle cx="200" cy="200" r="155" fill="#ffffff"/>
  
  <!-- Símbolo PSI (Ψ) estilizado - símbolo da Psicologia -->
  <g transform="translate(200, 205)">
    <!-- Haste central do Psi -->
    <line x1="0" y1="-60" x2="0" y2="70" stroke="url(#indigoGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Base horizontal do Psi -->
    <line x1="-35" y1="70" x2="35" y2="70" stroke="url(#indigoGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Arco esquerdo do Psi -->
    <path d="M -45,-20 Q -55,-40 -45,-55 Q -40,-65 -30,-60 L -30,20 Q -20,25 0,25" 
          fill="none" stroke="url(#indigoGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arco direito do Psi -->
    <path d="M 45,-20 Q 55,-40 45,-55 Q 40,-65 30,-60 L 30,20 Q 20,25 0,25" 
          fill="none" stroke="url(#indigoGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Detalhe decorativo: pequenos círculos como "pensamentos" -->
    <circle cx="-60" cy="-75" r="4" fill="url(#indigoLight)" opacity="0.8"/>
    <circle cx="-70" cy="-55" r="3" fill="url(#indigoLight)" opacity="0.6"/>
    <circle cx="60" cy="-75" r="4" fill="url(#indigoLight)" opacity="0.8"/>
    <circle cx="70" cy="-55" r="3" fill="url(#indigoLight)" opacity="0.6"/>
    
    <!-- Coração estilizado no topo (representando cuidado/empatia) -->
    <path d="M 0,-80 C -6,-88 -16,-88 -16,-78 C -16,-70 0,-62 0,-62 C 0,-62 16,-70 16,-78 C 16,-88 6,-88 0,-80 Z" 
          fill="url(#indigoLight)" opacity="0.9"/>
  </g>
  
  <!-- Texto curvo superior -->
  <path id="topCurve2" d="M 60,200 A 140,140 0 0,1 340,200" fill="none"/>
  <text font-family="Georgia, serif" font-size="15" font-weight="600" fill="#4338ca" letter-spacing="1.5">
    <textPath href="#topCurve2" startOffset="50%" text-anchor="middle">
      LEILIANE FONSECA SANTOS DUMONT
    </textPath>
  </text>
  
  <!-- Texto inferior -->
  <path id="bottomCurve2" d="M 60,200 A 140,140 0 0,0 340,200" fill="none"/>
  <text font-family="Georgia, serif" font-size="14" font-weight="500" fill="#6366f1" letter-spacing="3">
    <textPath href="#bottomCurve2" startOffset="50%" text-anchor="middle">
      PSICÓLOGA  ·  CRP 05/8146
    </textPath>
  </text>
  
  <!-- Linhas decorativas -->
  <line x1="115" y1="200" x2="135" y2="200" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="265" y1="200" x2="285" y2="200" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="145" cy="200" r="2" fill="#6366f1"/>
  <circle cx="255" cy="200" r="2" fill="#6366f1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="dualGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tealMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="indigoMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="softShadowMain">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo circular principal -->
  <circle cx="250" cy="180" r="130" fill="#ffffff" stroke="url(#dualGrad)" stroke-width="4" filter="url(#softShadowMain)"/>
  
  <!-- Divisão sutil vertical -->
  <line x1="250" y1="80" x2="250" y2="280" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Lado esquerdo: Símbolo médico (Caduceu simplificado) -->
  <g transform="translate(195, 180)">
    <!-- Bastão -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="url(#tealMain)" stroke-width="4" stroke-linecap="round"/>
    <!-- Serpente -->
    <path d="M 0,-40 C -15,-30 -15,-15 0,-5 C 15,5 15,20 0,30 C -10,37 -10,45 0,48" 
          fill="none" stroke="url(#tealMain)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 0,-40 C 15,-30 15,-15 0,-5 C -15,5 -15,20 0,30 C 10,37 10,45 0,48" 
          fill="none" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Asas -->
    <path d="M -3,-45 Q -20,-55 -26,-42 Q -15,-40 -5,-42 Z" fill="url(#tealMain)"/>
    <path d="M 3,-45 Q 20,-55 26,-42 Q 15,-40 5,-42 Z" fill="url(#tealMain)"/>
    <!-- Esfera superior -->
    <circle cx="0" cy="-52" r="5" fill="url(#tealMain)"/>
  </g>
  
  <!-- Lado direito: Símbolo da psicologia (Psi Ψ) -->
  <g transform="translate(305, 185)">
    <!-- Haste central -->
    <line x1="0" y1="-40" x2="0" y2="45" stroke="url(#indigoMain)" stroke-width="5" stroke-linecap="round"/>
    <!-- Base -->
    <line x1="-22" y1="45" x2="22" y2="45" stroke="url(#indigoMain)" stroke-width="5" stroke-linecap="round"/>
    <!-- Arco esquerdo -->
    <path d="M -28,-12 Q -35,-28 -28,-38 Q -22,-42 -18,-38 L -18,12 Q -12,18 0,15" 
          fill="none" stroke="url(#indigoMain)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arco direito -->
    <path d="M 28,-12 Q 35,-28 28,-38 Q 22,-42 18,-38 L 18,12 Q 12,18 0,15" 
          fill="none" stroke="url(#indigoMain)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Coração acima -->
    <path d="M 0,-52 C -4,-58 -11,-58 -11,-50 C -11,-45 0,-40 0,-40 C 0,-40 11,-45 11,-50 C 11,-58 4,-58 0,-52 Z" 
          fill="#a5b4fc" opacity="0.8"/>
  </g>
  
  <!-- Linha decorativa central unindo os dois símbolos -->
  <circle cx="250" cy="240" r="4" fill="url(#dualGrad)"/>
  <line x1="225" y1="240" x2="246" y2="240" stroke="url(#dualGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="254" y1="240" x2="275" y2="240" stroke="url(#dualGrad)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Nome do consultório -->
  <text x="250" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1e293b" letter-spacing="2">
    Consultório
  </text>
  <text x="250" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="500" fill="url(#dualGrad)" letter-spacing="4">
    LOTTI · FONSECA
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="tealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo externo -->
  <circle cx="200" cy="200" r="180" fill="url(#tealGrad)" filter="url(#softShadow)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
  
  <!-- Círculo interno branco -->
  <circle cx="200" cy="200" r="155" fill="#ffffff"/>
  
  <!-- Caduceu estilizado (símbolo médico) -->
  <g transform="translate(200, 200)">
    <!-- Bastão central -->
    <line x1="0" y1="-75" x2="0" y2="75" stroke="url(#tealGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Cobra esquerda -->
    <path d="M 0,-60 C -25,-45 -25,-25 0,-10 C 25,5 25,25 0,40 C -15,50 -15,60 0,65" 
          fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Cabeça cobra esquerda -->
    <circle cx="-3" cy="-62" r="5" fill="url(#tealGrad)"/>
    
    <!-- Cobra direita -->
    <path d="M 0,-60 C 25,-45 25,-25 0,-10 C -25,5 -25,25 0,40 C 15,50 15,60 0,65" 
          fill="none" stroke="url(#tealLight)" stroke-width="5" stroke-linecap="round"/>
    <!-- Cabeça cobra direita -->
    <circle cx="3" cy="-62" r="5" fill="url(#tealLight)"/>
    
    <!-- Asas -->
    <path d="M -5,-70 Q -35,-85 -45,-65 Q -30,-60 -10,-65 Z" fill="url(#tealGrad)" opacity="0.9"/>
    <path d="M 5,-70 Q 35,-85 45,-65 Q 30,-60 10,-65 Z" fill="url(#tealGrad)" opacity="0.9"/>
    <path d="M -5,-75 Q -25,-90 -32,-72 Q -20,-68 -8,-72 Z" fill="url(#tealLight)" opacity="0.8"/>
    <path d="M 5,-75 Q 25,-90 32,-72 Q 20,-68 8,-72 Z" fill="url(#tealLight)" opacity="0.8"/>
    
    <!-- Esfera no topo -->
    <circle cx="0" cy="-80" r="7" fill="url(#tealGrad)"/>
    <circle cx="-2" cy="-82" r="2" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Texto curvo superior -->
  <path id="topCurve" d="M 60,200 A 140,140 0 0,1 340,200" fill="none"/>
  <text font-family="Georgia, serif" font-size="18" font-weight="600" fill="#0d9488" letter-spacing="2">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      DRA. LUCIANE LOTTI FONSECA
    </textPath>
  </text>
  
  <!-- Texto inferior -->
  <path id="bottomCurve" d="M 60,200 A 140,140 0 0,0 340,200" fill="none"/>
  <text font-family="Georgia, serif" font-size="14" font-weight="500" fill="#14b8a6" letter-spacing="3">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      CRM 52550437
    </textPath>
  </text>
  
  <!-- Linhas decorativas -->
  <line x1="115" y1="200" x2="135" y2="200" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
  <line x1="265" y1="200" x2="285" y2="200" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="145" cy="200" r="2" fill="#14b8a6"/>
  <circle cx="255" cy="200" r="2" fill="#14b8a6"/>
</svg>
